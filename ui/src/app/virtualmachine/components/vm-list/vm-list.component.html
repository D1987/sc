<div class="mat-cell">
  <h2>VIRTUAL MACHINES</h2>  
  <mat-card>
    <mat-card-content>
      <div class="form">
          <mat-form-field appearance="outline">
              <mat-label>Search Virtual Machine</mat-label>
              <input matInput (keyup)="applyFilter($event)" placeholder="Type smth." [(ngModel)]="searchField" #input>
              <mat-icon matPrefix>search</mat-icon>
              <mat-icon matSuffix *ngIf="searchField" (click)="clearFilters()" class="cursor-pointer">clear</mat-icon>
          </mat-form-field>
      </div>  
      <mat-table #table [dataSource]="dataSource" matSort class="mat-cell">  
        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <mat-header-cell *matHeaderCellDef mat-sort-header>Name</mat-header-cell>
          <mat-cell *matCellDef="let vm">
              <a [routerLink]="['vmdetail', vm.id]">{{vm?.name}}</a>            
          </mat-cell>
        </ng-container>
        <!-- IP Column -->
        <ng-container matColumnDef="ip">
          <mat-header-cell *matHeaderCellDef mat-sort-header>IP</mat-header-cell>
          <mat-cell *matCellDef="let vm">
            <a [attr.href]="'//' + vm?.ip" target="_blank" >{{vm?.ip}}</a>
          </mat-cell>      
        </ng-container>
        <!-- Critical Column -->
        <ng-container matColumnDef="critical">
          <mat-header-cell *matHeaderCellDef mat-sort-header>Critical</mat-header-cell>
          <mat-cell *matCellDef="let vm">
            <mat-icon class="check-icon" *ngIf="vm?.critical;">check</mat-icon>
          </mat-cell>      
        </ng-container>
        <!-- Enabled Column -->
        <ng-container matColumnDef="on">
          <mat-header-cell *matHeaderCellDef>On</mat-header-cell>
          <mat-cell *matCellDef="let vm">
            <mat-icon class="off" *ngIf="!vm?.enabled;">offline_pin</mat-icon>
          </mat-cell>
        </ng-container>     
        <!-- actions -->
        <ng-container matColumnDef="actions" >
          <mat-header-cell *matHeaderCellDef class="align-right">
            <button mat-icon-button color="primary" [routerLink]="['vm', 0]">
              <mat-icon aria-label="Add">add</mat-icon>
            </button>
          </mat-header-cell>  
          <mat-cell *matCellDef="let vm; let i=index;" class="align-right">
            <button mat-icon-button color="primary" [routerLink]="['vm', vm.id]">
              <mat-icon aria-label="Edit">edit</mat-icon>
            </button>  
            <button mat-icon-button color="primary"(click)="openDialog(vm.id, vm.name)">
              <mat-icon aria-label="Delete">delete</mat-icon>
            </button>
          </mat-cell>
        </ng-container>  
        <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
        <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
      </mat-table> 
      <mat-paginator [pageSize]="100" [pageSizeOptions]="[10,50,100,200]"></mat-paginator>
    </mat-card-content>
  </mat-card>
</div>
